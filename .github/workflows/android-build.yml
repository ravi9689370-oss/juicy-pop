name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Android Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Project Web Files
      run: |
        # In this self-contained vanilla project, Web files already exist in root folder.
        # Check integrity of key web resources
        ls index.html manifest.json js/game.js css/style.css

    - name: Install Capacitor Dependencies
      run: |
        npm install
        npm install --save-dev @capacitor/assets

    - name: Stage Web Assets for Capacitor
      run: |
        # Capacitor needs an isolated web root (repo root contains CI files)
        mkdir -p www
        cp index.html manifest.json sw.js www/
        cp -r css js assets www/

    - name: Prepare Icon Source for Capacitor Assets
      run: |
        # @capacitor/assets looks for icon.png in project root
        cp assets/launcher-icon.png icon.png
        # Also ensure splash screen source exists (optional)
        # cp assets/logo.png splash.png

    - name: Generate Android Launcher Icons
      run: |
        npx @capacitor/assets generate --android --iconBackgroundColor "#F97316" --iconBackgroundColorDark "#F97316"

    - name: Setup Java JDK (v17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --licenses | grep -c "Accept" || true

    - name: Build and Sync Capacitor Android Project
      run: |
        npx cap add android
        npx cap sync android

    - name: Verify AndroidManifest.xml icon references
      run: |
        grep -n "android:icon\|android:roundIcon" android/app/src/main/AndroidManifest.xml

    - name: Verify mipmap icons generated
      run: |
        ls -la android/app/src/main/res/mipmap-*/ic_launcher*.png

    - name: Set Executable Permissions for Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Clean and Build Debug Android APK
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Verify APK Output
      run: |
        test -f android/app/build/outputs/apk/debug/app-debug.apk
        ls -la android/app/build/outputs/apk/debug/app-debug.apk

    - name: Archive Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: juicy-pop-game-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
